services:
  postgres:
    image: postgres:17-alpine
    container_name: benefits_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-benefits}
      POSTGRES_USER: ${POSTGRES_USER:-benefits_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benefits_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-benefits_user} -d ${POSTGRES_DB:-benefits}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - benefits_network

  redis:
    image: redis:7-alpine
    container_name: benefits_redis
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - benefits_network

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: benefits_ollama
  #   volumes:
  #     - ollama:/root/.ollama
  #   ports:
  #     - "${OLLAMA_PORT:-11434}:11434"
  #   healthcheck:
  #     test: ["CMD-SHELL", "ollama list || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 30s
  #   restart: unless-stopped
  #   networks:
  #     - benefits_network
  # Note: Using host Ollama systemd service at 127.0.0.1:11434

  # Схема создаётся только миграциями (ТЗ §30, §39): create_all() в коде нет.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: benefits_migrate
    command: migrate
    environment: &db_env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-benefits}
      POSTGRES_USER: ${POSTGRES_USER:-benefits_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benefits_pass}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - benefits_network

  seeds:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: benefits_seeds
    command: seed
    environment:
      <<: *db_env
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo1234!}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - benefits_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # В локальной сборке нужны pytest/ruff/mypy: проверки §52 запускаются
        # внутри контейнера. Для production-сборки передаётся false.
        INSTALL_DEV: ${INSTALL_DEV:-true}
    container_name: benefits_backend
    command: serve
    environment:
      <<: *db_env
      PROJECT_NAME: "Corporate Benefits Platform"
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_EXPIRE_MINUTES: 15
      JWT_REFRESH_EXPIRE_DAYS: 7
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:31b}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-true}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-30}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10}
      RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER:-5}
      RATE_LIMIT_AI: ${RATE_LIMIT_AI:-15}
      RATE_LIMIT_BENEFITS: ${RATE_LIMIT_BENEFITS:-60}
      RATE_LIMIT_REDEMPTIONS: ${RATE_LIMIT_REDEMPTIONS:-10}
      PROMO_CODE_DEFAULT_VALID_DAYS: ${PROMO_CODE_DEFAULT_VALID_DAYS:-30}
      INVITE_TOKEN_EXPIRE_DAYS: ${INVITE_TOKEN_EXPIRE_DAYS:-7}
      SSE_TICKET_TTL_SECONDS: ${SSE_TICKET_TTL_SECONDS:-60}
      BOT_API_KEY: ${BOT_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      seeds:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - benefits_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: benefits_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - benefits_network

  # Проверка промокодов в Telegram. Отдельный сервис: падение бота не должно
  # влиять на API, а перезапуск API не требует пересборки бота.
  tg_bot:
    build:
      context: ./tg_bot
      dockerfile: Dockerfile
    container_name: benefits_tg_bot
    environment:
      # Без :? — иначе отсутствие токена ломает любую docker compose команду,
      # включая работу с остальными сервисами. Проверку делает сам bot.py.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BACKEND_URL: http://backend:8000
      BOT_API_KEY: ${BOT_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - benefits_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: benefits_nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - benefits_network

volumes:
  pgdata:
    name: benefits_pgdata
  redisdata:
    name: benefits_redisdata
  # ollama:
  #   name: benefits_ollama

networks:
  benefits_network:
    name: benefits_network
    driver: bridge
