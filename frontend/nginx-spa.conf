# Раздача собранного SPA. Проксирование API здесь не настраивается: этим
# занимается пограничный nginx (../nginx/nginx.conf), а этот контейнер отдаёт
# только статику.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Хеши в именах файлов делают их неизменяемыми — кэшируем надолго.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируется: иначе после деплоя браузер продолжает грузить
    # старый файл со ссылками на удалённые бандлы.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # History fallback: маршруты вида /benefits/<uuid> обслуживает роутер в браузере.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
